}

input PersonInput {
  name: String
  email: String
  companyId: ID
  phone: String
  jobTitle: String
  linkedin: LinkInput
  twitter: LinkInput
}

input TaskInput {
  title: String
  body: RichText
  companyIds: [ID!]
}

input NoteInput {
  title: String
  body: RichText
  companyIds: [ID!]
}

input SendEmailInput {
  "Set when replying inside an existing thread."
  threadId: ID
  from: String!
  to: [String!]!
  cc: [String!]
  bcc: [String!]
  subject: String
  text: RichText
}

input CalendarEventInput {
