union CreateCompanyResult = Company | NotAuthorized
union UpdateCompanyResult = Company | NotAuthorized
union CreatePersonResult = Person | NotAuthorized
union UpdatePersonResult = Person | NotAuthorized
union CreateTaskResult = Task | NotAuthorized
union UpdateTaskResult = Task | NotAuthorized
union CompleteTaskResult = Task | NotAuthorized
union AssignTaskResult = Task | NotAuthorized
union DeleteTaskResult = Task | NotAuthorized
union CreateNoteResult = Note | NotAuthorized
union UpdateNoteResult = Note | NotAuthorized
union DeleteNoteResult = Note | NotAuthorized
union SendEmailResult = Email | NotAuthorized
union CreateCalendarEventResult = CalendarEvent | NotAuthorized
union RenameFileResult = File | NotAuthorized
union AddFavoriteResult = Favorite | NotAuthorized

type Mutation {
  createCompany(input: CompanyInput!): CreateCompanyResult!
  updateCompany(id: ID!, input: CompanyInput!): UpdateCompanyResult!
  createPerson(input: PersonInput!): CreatePersonResult!
  updatePerson(id: ID!, input: PersonInput!): UpdatePersonResult!
  createTask(input: TaskInput!): CreateTaskResult!
  updateTask(id: ID!, input: TaskInput!): UpdateTaskResult!
  completeTask(id: ID!): CompleteTaskResult!
  assignTask(id: ID!, assigneeId: ID!): AssignTaskResult!
  deleteTask(id: ID!): DeleteTaskResult!
  createNote(input: NoteInput!): CreateNoteResult!
  updateNote(id: ID!, input: NoteInput!): UpdateNoteResult!
  deleteNote(id: ID!): DeleteNoteResult!
  sendEmail(input: SendEmailInput!): SendEmailResult!
  createCalendarEvent(input: CalendarEventInput!): CreateCalendarEventResult!
  renameFile(id: ID!, name: String!): RenameFileResult!
  addFavorite(recordId: ID!, folder: String): AddFavoriteResult!
}
